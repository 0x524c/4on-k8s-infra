# Source: hyperswitch-hml/templates/saq-proxy.yaml
# The translator, the compose service saq-proxy (code/saq-proxy): the SAQ API that CommerceGate calls, which calls
# the router over the cluster network. Its database is its own (role and database saqproxy, made by the db-init Job).
# Sandbox only: no live credential set, no live router merchant (the live variables are never set here). Its router
# API key and business profile are HYPERSWITCH_API_KEY and HYPERSWITCH_PROFILE_ID of the Secret,
# which exist only once the merchant was created in the router: until then the container waits in
# CreateContainerConfigError and starts by itself when both keys are added (README.md, section First install). One
# process at a time (Recreate), like the compose service. NodePort for the load balancer.
apiVersion: v1
kind: Service
metadata:
  name: saq-proxy
  labels:
    app.kubernetes.io/name: hyperswitch-hml
    app.kubernetes.io/instance: hyperswitch-hml
    app.kubernetes.io/component: saq-proxy
    app.kubernetes.io/part-of: hyperswitch
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hyperswitch-hml-0.1.0
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: hyperswitch-hml
    app.kubernetes.io/instance: hyperswitch-hml
    app.kubernetes.io/component: saq-proxy
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30070
---
# Source: hyperswitch-hml/templates/saq-proxy.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saq-proxy
  labels:
    app.kubernetes.io/name: hyperswitch-hml
    app.kubernetes.io/instance: hyperswitch-hml
    app.kubernetes.io/component: saq-proxy
    app.kubernetes.io/part-of: hyperswitch
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hyperswitch-hml-0.1.0
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hyperswitch-hml
      app.kubernetes.io/instance: hyperswitch-hml
      app.kubernetes.io/component: saq-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hyperswitch-hml
        app.kubernetes.io/instance: hyperswitch-hml
        app.kubernetes.io/component: saq-proxy
        app.kubernetes.io/part-of: hyperswitch
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: hyperswitch-hml-0.1.0
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      initContainers:
        # Its own database, made by the db-init Job of the same revision: the translator stops at start without it.
        - name: wait-database
          image: docker.io/postgres:17
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until psql -X -q -t -A -c 'SELECT 1' >/dev/null 2>&1; do echo 'wait-database: saqproxy cannot sign in to saqproxy yet'; sleep 3; done"]
          env:
            - name: PGHOST
              value: postgres
            - name: PGUSER
              value: saqproxy
            - name: PGDATABASE
              value: saqproxy
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: hyperswitch-secrets
                  key: SAQ_PROXY_DB_PASSWORD
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
        - name: wait-router
          image: 405712027313.dkr.ecr.sa-east-1.amazonaws.com/hyperswitch-hml-router:2024.01.10.0-6318-ge65f9eea4
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until curl -fsS --max-time 5 -o /dev/null http://router:8080/health; do echo 'wait-router: the router does not answer yet'; sleep 3; done"]
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
      containers:
        - name: saq-proxy
          image: 405712027313.dkr.ecr.sa-east-1.amazonaws.com/hyperswitch-hml-saq-proxy:544dca824d37
          imagePullPolicy: IfNotPresent
          env:
            - name: SAQ_PROXY_LISTEN
              value: 0.0.0.0:8080
            - name: SAQ_PROXY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hyperswitch-secrets
                  key: SAQ_PROXY_DB_PASSWORD
            - name: DATABASE_URL
              value: postgresql://saqproxy:$(SAQ_PROXY_DB_PASSWORD)@postgres:5432/saqproxy
            - name: SAQ_PROXY_PUBLIC_BASE_URL
              value: "https://api-hml.rl.be4on.com"
            - name: SAQ_PROXY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hyperswitch-secrets
                  key: SAQ_PROXY_JWT_SECRET
            - name: SAQ_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: hyperswitch-secrets
                  key: SAQ_CLIENT_ID
            - name: SAQ_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hyperswitch-secrets
                  key: SAQ_CLIENT_SECRET
            - name: SAQ_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: hyperswitch-secrets
                  key: SAQ_HMAC_KEY
            - name: SAQ_ACCOUNT_BRANCH
              valueFrom:
                secretKeyRef:
                  name: hyperswitch-secrets
                  key: SAQ_ACCOUNT_BRANCH
            - name: SAQ_ACCOUNT_NUMBER
              valueFrom:
                secretKeyRef:
                  name: hyperswitch-secrets
                  key: SAQ_ACCOUNT_NUMBER
            - name: SAQ_ALLOWED_CLIENT_IPS
              value: ""
            - name: SAQ_TRUST_FORWARDED_FOR
              value: "true"
            - name: HYPERSWITCH_BASE_URL
              value: http://router:8080
            - name: HYPERSWITCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hyperswitch-secrets
                  key: HYPERSWITCH_API_KEY
            - name: HYPERSWITCH_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: hyperswitch-secrets
                  key: SAQ_PROXY_WEBHOOK_SECRET
            - name: HYPERSWITCH_MERCHANT_ID
              value: "versal_labsvelora"
            - name: HYPERSWITCH_PROFILE_ID
              valueFrom:
                secretKeyRef:
                  name: hyperswitch-secrets
                  key: HYPERSWITCH_PROFILE_ID
            - name: HYPERSWITCH_WEBHOOK_ALLOWED_IPS
              value: ""
            # Optional settings of the Secret, absent unless set (the compose file passes them empty).
            - name: SAQ_PIX_KEYS
              valueFrom:
                secretKeyRef:
                  name: hyperswitch-secrets
                  key: SAQ_PIX_KEYS
                  optional: true
            - name: SAQ_ACCOUNT_HOLDER_NAME
              valueFrom:
                secretKeyRef:
                  name: hyperswitch-secrets
                  key: SAQ_ACCOUNT_HOLDER_NAME
                  optional: true
            - name: SAQ_ACCOUNT_HOLDER_DOCUMENT
              valueFrom:
                secretKeyRef:
                  name: hyperswitch-secrets
                  key: SAQ_ACCOUNT_HOLDER_DOCUMENT
                  optional: true
            - name: SAQ_DICT_SYNTHETIC
              value: "false"
            - name: SAQ_DICT_LIVE_DOCUMENT_FALLBACK
              value: "false"
            - name: SAQ_SANDBOX_SIMULATOR
              value: "true"
            - name: SAQ_WEBHOOK_HMAC_HEADER
              value: "false"
            - name: SAQ_QR_EXPIRY_CANCEL
              value: "sandbox"
            - name: RUST_LOG
              value: "info"
          ports:
            - name: http
              containerPort: 8080
          # The compose healthcheck: GET /health answers 200.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
---
# Source: hyperswitch-hml/templates/db-init.yaml
# The translator's own role and database on the stack's Postgres (role saqproxy, database saqproxy), the in-cluster
# counterpart of what provision.sh saq-proxy does on RDS: created when absent, the role's password set to
# SAQ_PROXY_DB_PASSWORD of the Secret, PUBLIC revoked on the database, CONNECT and TEMPORARY granted to the role, and
# USAGE and CREATE on its public schema. The session logs no statement, so the password never reaches the server's
# log. A Job of each release revision (its name carries the revision, so an upgrade runs it again and Helm removes the
# one of the revision before), like every one-shot of this chart; the translator waits for its database in its init
# container wait-database. Only with the translator.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init-1
  labels:
    app.kubernetes.io/name: hyperswitch-hml
    app.kubernetes.io/instance: hyperswitch-hml
    app.kubernetes.io/component: db-init
    app.kubernetes.io/part-of: hyperswitch
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hyperswitch-hml-0.1.0
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hyperswitch-hml
        app.kubernetes.io/instance: hyperswitch-hml
        app.kubernetes.io/component: db-init
        app.kubernetes.io/part-of: hyperswitch
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: hyperswitch-hml-0.1.0
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: docker.io/postgres:17
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              until pg_isready -q; do echo "db-init: waiting for postgres"; sleep 2; done
              psql -X -q -t -A -v ON_ERROR_STOP=1 <<'SQL'
              SET log_statement = 'none';
              SET log_min_error_statement = 'panic';
              SET log_min_duration_statement = -1;
              \getenv role SAQ_ROLE
              \getenv db SAQ_DB
              \getenv password SAQ_PASSWORD
              SELECT CASE WHEN EXISTS (SELECT FROM pg_roles WHERE rolname = :'role') THEN 'exists   role ' ELSE 'created  role ' END || :'role';
              SELECT format('CREATE ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD %L', :'role', :'password') WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'role') \gexec
              SELECT format('ALTER ROLE %I LOGIN PASSWORD %L', :'role', :'password') \gexec
              SELECT CASE WHEN EXISTS (SELECT FROM pg_database WHERE datname = :'db') THEN 'exists   database ' ELSE 'created  database ' END || :'db';
              SELECT format('CREATE DATABASE %I', :'db') WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'db') \gexec
              SELECT format('REVOKE ALL ON DATABASE %I FROM PUBLIC', :'db') \gexec
              SELECT format('GRANT CONNECT, TEMPORARY ON DATABASE %I TO %I', :'db', :'role') \gexec
              \connect :db
              SELECT format('GRANT USAGE, CREATE ON SCHEMA public TO %I', :'role') \gexec
              SQL
              who=$(PGUSER=$SAQ_ROLE PGPASSWORD=$SAQ_PASSWORD PGDATABASE=$SAQ_DB psql -X -q -t -A -c 'SELECT current_user || chr(64) || current_database()')
              [ "$who" = "$SAQ_ROLE@$SAQ_DB" ] || { echo "db-init: FAILED: signed in as '$who', expected $SAQ_ROLE@$SAQ_DB"; exit 1; }
              echo "db-init: ok: $SAQ_ROLE signs in to $SAQ_DB with the password of the Secret"
          env:
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: db_user
            - name: PGDATABASE
              value: hyperswitch_db
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: hyperswitch-secrets
                  key: DB_PASSWORD
            - name: SAQ_ROLE
              value: saqproxy
            - name: SAQ_DB
              value: saqproxy
            - name: SAQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hyperswitch-secrets
                  key: SAQ_PROXY_DB_PASSWORD
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false

# The one Argo CD project of the HML cluster: the deploy repository, the Woodpecker chart and the two SigNoz charts as sources,
# the namespaces hyperswitch, woodpecker and signoz of this cluster as destinations, and only the cluster-scoped kinds the stack
# really has (the namespace, the gp3 StorageClass, the ClusterRoles and their bindings of the log agent and of SigNoz, and the three
# ClickHouse operator CRDs that the SigNoz chart installs).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: hml
  namespace: argocd
spec:
  description: HML environment on EKS (cluster hyperswitch-hml)
  sourceRepos:
    - git@github.com:0x524c/4on-k8s-infra.git
    - ghcr.io/woodpecker-ci/helm
    - https://charts.signoz.io
  destinations:
    - server: https://kubernetes.default.svc
      namespace: hyperswitch
    - server: https://kubernetes.default.svc
      namespace: woodpecker
    - server: https://kubernetes.default.svc
      namespace: signoz
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: storage.k8s.io
      kind: StorageClass
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  # The token the Woodpecker workflow `deploy-hml` uses: it can read and sync the applications of this project and nothing
  # else. Made once with `argocd proj role create-token hml deployer`.
  roles:
    - name: deployer
      description: the CI workflow that syncs the HML applications
      policies:
        - p, proj:hml:deployer, applications, get, hml/*, allow
        - p, proj:hml:deployer, applications, sync, hml/*, allow

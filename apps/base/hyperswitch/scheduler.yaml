            - name: ROUTER__EVENTS__SOURCE
              value: "kafka"
            - name: ROUTER__EVENTS__KAFKA__BROKERS
              value: eventbus:9092
            - name: ROUTER__EVENTS__KAFKA__LOG_EVENTS
              value: "true"
            - name: SCHEDULER_FLOW
              value: producer
          startupProbe:
            exec:
              command: ["curl", "-fsS", "--max-time", "3", "-o", "/dev/null", "http://127.0.0.1:3000/health"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["curl", "-fsS", "--max-time", "3", "-o", "/dev/null", "http://127.0.0.1:3000/health"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["curl", "-fsS", "--max-time", "3", "-o", "/dev/null", "http://127.0.0.1:3000/health"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false

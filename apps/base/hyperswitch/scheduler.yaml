# Source: hyperswitch-hml/templates/scheduler.yaml
# The scheduler consumer, the compose service scheduler-consumer: the router's environment plus SCHEDULER_FLOW. It starts
# after the router answers, as in the compose file. One process at a time (Recreate). The probes read the scheduler's
# own health server (127.0.0.1:3000 in the fork's config), which the compose service does not check.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-consumer
  labels:
    app.kubernetes.io/name: hyperswitch-hml
    app.kubernetes.io/instance: hyperswitch-hml
    app.kubernetes.io/component: scheduler-consumer
    app.kubernetes.io/part-of: hyperswitch
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hyperswitch-hml-0.1.0
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hyperswitch-hml
      app.kubernetes.io/instance: hyperswitch-hml
      app.kubernetes.io/component: scheduler-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hyperswitch-hml
        app.kubernetes.io/instance: hyperswitch-hml
        app.kubernetes.io/component: scheduler-consumer
        app.kubernetes.io/part-of: hyperswitch
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: hyperswitch-hml-0.1.0
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      initContainers:
        - name: wait-migrations
          image: 405712027313.dkr.ecr.sa-east-1.amazonaws.com/hyperswitch-hml-migrate:2024.01.10.0-6318-ge65f9eea4
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until [ "$(/root/.cargo/bin/diesel migration --database-url "$DATABASE_URL" pending --migration-dir /migrations --config-file /etc/diesel-empty.toml 2>/dev/null)" = false ]; do
                echo "wait-migrations: migrations pending or database not ready"; sleep 3
              done
              echo "wait-migrations: every migration is applied"
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hyperswitch-secrets
                  key: DB_PASSWORD
            - name: DATABASE_URL
              value: postgresql://db_user:$(DB_PASSWORD)@postgres:5432/hyperswitch_db
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
        - name: wait-router
          image: 405712027313.dkr.ecr.sa-east-1.amazonaws.com/hyperswitch-hml-scheduler:2024.01.10.0-6318-ge65f9eea4
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until curl -fsS --max-time 5 -o /dev/null http://router:8080/health; do echo 'wait-router: the router does not answer yet'; sleep 3; done"]
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
      containers:
        - name: scheduler
          image: 405712027313.dkr.ecr.sa-east-1.amazonaws.com/hyperswitch-hml-scheduler:2024.01.10.0-6318-ge65f9eea4
          imagePullPolicy: IfNotPresent
          command: ["/local/bin/scheduler", "-f", "/local/config/docker_compose.toml"]
          env:
            - name: RUN_ENV
              value: sandbox
            - name: RUST_MIN_STACK
              value: "6291456"
            - name: ROUTER__MASTER_DATABASE__HOST
              value: postgres
            - name: ROUTER__MASTER_DATABASE__PORT
              value: "5432"
            - name: ROUTER__MASTER_DATABASE__USERNAME
              value: db_user
            - name: ROUTER__MASTER_DATABASE__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hyperswitch-secrets
                  key: DB_PASSWORD
            - name: ROUTER__MASTER_DATABASE__DBNAME
              value: hyperswitch_db
            - name: ROUTER__MASTER_DATABASE__MAX_POOL_SIZE
              value: "5"
            - name: ROUTER__REPLICA_DATABASE__HOST

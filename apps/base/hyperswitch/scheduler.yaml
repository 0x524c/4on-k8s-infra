            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["curl", "-fsS", "--max-time", "3", "-o", "/dev/null", "http://127.0.0.1:3000/health"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:

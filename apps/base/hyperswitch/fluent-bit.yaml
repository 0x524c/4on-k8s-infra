---
# Source: hyperswitch-hml/templates/fluent-bit.yaml
# The container logs (plan decision H12): a Fluent Bit DaemonSet that tails the containers of this namespace only and
# sends each line, as the container wrote it, to the CloudWatch log group containerLogs.logGroup, one stream per
# container and pod (<container>.<pod>), the way production's docker awslogs driver sends them to /hyperswitch. AWS
# credentials come from EKS Pod Identity, bound by Terraform to the service account below, whose role may only write
# to that group (it never creates one); the node's instance metadata is closed to pods, so the region is set here.
# containerLogs.output stdout prints the records instead (the local proof, where no AWS exists).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  labels:
    app.kubernetes.io/name: hyperswitch-hml
    app.kubernetes.io/instance: hyperswitch-hml
    app.kubernetes.io/component: fluent-bit
    app.kubernetes.io/part-of: hyperswitch
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hyperswitch-hml-0.1.0
---
# Source: hyperswitch-hml/templates/fluent-bit.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  labels:
    app.kubernetes.io/name: hyperswitch-hml
    app.kubernetes.io/instance: hyperswitch-hml
    app.kubernetes.io/component: fluent-bit
    app.kubernetes.io/part-of: hyperswitch
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hyperswitch-hml-0.1.0
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        5
        Log_Level    warn
        Daemon       off
        Parsers_File /fluent-bit/etc/parsers.conf

    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*_hyperswitch_*.log
        Exclude_Path      /var/log/containers/fluent-bit-*
        multiline.parser  cri
        DB                /var/fluent-bit/state/tail.db
        Mem_Buf_Limit     16MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    [FILTER]
        Name             kubernetes
        Match            kube.*
        Kube_Tag_Prefix  kube.var.log.containers.
        Merge_Log        Off
        Keep_Log         On
        Labels           Off
        Annotations      Off

    [OUTPUT]
        Name                cloudwatch_logs
        Match               kube.*
        region              sa-east-1
        log_group_name      /hyperswitch-hml
        log_stream_template $kubernetes['container_name'].$kubernetes['pod_name']
        log_stream_prefix   unknown.
        log_key             log
        auto_create_group   Off
        retry_limit         5
---
# Source: hyperswitch-hml/templates/fluent-bit.yaml
# The kubernetes filter reads the pod and namespace of each line.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hyperswitch-hml-fluent-bit-read
  labels:
    app.kubernetes.io/name: hyperswitch-hml
    app.kubernetes.io/instance: hyperswitch-hml
    app.kubernetes.io/component: fluent-bit
    app.kubernetes.io/part-of: hyperswitch
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hyperswitch-hml-0.1.0
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
# Source: hyperswitch-hml/templates/fluent-bit.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hyperswitch-hml-fluent-bit-read
  labels:
    app.kubernetes.io/name: hyperswitch-hml
    app.kubernetes.io/instance: hyperswitch-hml
    app.kubernetes.io/component: fluent-bit
    app.kubernetes.io/part-of: hyperswitch
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hyperswitch-hml-0.1.0
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hyperswitch-hml-fluent-bit-read
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: hyperswitch
---
# Source: hyperswitch-hml/templates/fluent-bit.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  labels:
    app.kubernetes.io/name: hyperswitch-hml
    app.kubernetes.io/instance: hyperswitch-hml
    app.kubernetes.io/component: fluent-bit
    app.kubernetes.io/part-of: hyperswitch
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hyperswitch-hml-0.1.0
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hyperswitch-hml
      app.kubernetes.io/instance: hyperswitch-hml
      app.kubernetes.io/component: fluent-bit
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hyperswitch-hml
        app.kubernetes.io/instance: hyperswitch-hml
        app.kubernetes.io/component: fluent-bit
        app.kubernetes.io/part-of: hyperswitch
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: hyperswitch-hml-0.1.0
      annotations:
        checksum/config: 04d35880730b55c5bd96d3461a9862fca002edd68503c3573c43348178978af7
    spec:
      serviceAccountName: fluent-bit
      enableServiceLinks: false
      tolerations:
        - operator: Exists
      containers:
        - name: fluent-bit
          image: cr.fluentbit.io/fluent/fluent-bit:4.2@sha256:6806769c10acf11b41d14083b3101a24433b4ca113a1ab7a6b1a1b7cad86a7e8
          imagePullPolicy: IfNotPresent
          env:
            - name: AWS_REGION
              value: "sa-east-1"
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 20m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: state
              mountPath: /var/fluent-bit/state
      volumes:
        - name: config
          configMap:
            name: fluent-bit-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: state
          hostPath:
            path: /var/fluent-bit/hyperswitch
            type: DirectoryOrCreate

---
# Source: hyperswitch-hml/templates/postgres.yaml
# Postgres 17, the compose service pg: the fork's database hyperswitch_db (user db_user) and the translator's database
# saqproxy (role saqproxy, made by the db-init Job).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: hyperswitch-hml
    app.kubernetes.io/instance: hyperswitch-hml
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: hyperswitch
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hyperswitch-hml-0.1.0
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hyperswitch-hml
    app.kubernetes.io/instance: hyperswitch-hml
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# Source: hyperswitch-hml/templates/postgres.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: hyperswitch-hml
    app.kubernetes.io/instance: hyperswitch-hml
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: hyperswitch
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hyperswitch-hml-0.1.0
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hyperswitch-hml
      app.kubernetes.io/instance: hyperswitch-hml
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hyperswitch-hml
        app.kubernetes.io/instance: hyperswitch-hml
        app.kubernetes.io/component: postgres
        app.kubernetes.io/part-of: hyperswitch
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: hyperswitch-hml-0.1.0
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: docker.io/postgres:17
          imagePullPolicy: IfNotPresent
          args: ["-c", "max_connections=200"]
          env:
            - name: POSTGRES_USER
              value: db_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hyperswitch-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              value: hyperswitch_db
            # A subdirectory: the root of a new volume holds lost+found, which initdb refuses.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          # The compose healthcheck: pg_isready on the database as its user.
          startupProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-d", "hyperswitch_db", "-U", "db_user"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-d", "hyperswitch_db", "-U", "db_user"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-d", "hyperswitch_db", "-U", "db_user"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: hyperswitch-hml
          app.kubernetes.io/instance: hyperswitch-hml
          app.kubernetes.io/component: postgres
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "gp3"
        resources:
          requests:
            storage: 20Gi

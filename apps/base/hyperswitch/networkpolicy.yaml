---
# Source: hyperswitch-hml/templates/networkpolicy.yaml
# Ingress between the pods of the release: denied unless a rule below allows it. Egress is not restricted (the router
# calls the providers' sandbox hosts). The probes of the restricted services are exec probes, so no rule depends on
# whether the network plugin lets the node's own traffic through.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hyperswitch-default-deny-ingress
  labels:
    app.kubernetes.io/name: hyperswitch-hml
    app.kubernetes.io/instance: hyperswitch-hml
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: hyperswitch
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hyperswitch-hml-0.1.0
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hyperswitch-hml
      app.kubernetes.io/instance: hyperswitch-hml
  policyTypes: ["Ingress"]
---
# Source: hyperswitch-hml/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: router-ingress
  labels:
    app.kubernetes.io/name: hyperswitch-hml
    app.kubernetes.io/instance: hyperswitch-hml
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: hyperswitch
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hyperswitch-hml-0.1.0
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hyperswitch-hml
      app.kubernetes.io/instance: hyperswitch-hml
      app.kubernetes.io/component: router
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
---
